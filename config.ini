[general]

HOME_DIR=./users/default/
# LOW: 320x240; HIGH: 640x480 (main terminal mode).
_TERM_RESOLUTION=HIGH
_RETROPROFILE=vt220-green
_TERM_MOUSE_SHOW=disable


[settings]

# Startup offers BUDOWIN; choose n to use the command line.

# === SHADER ===

_TERM_SHADER = enable
SHADER_QUALITY = MEDIUM

# === OVERLAY ===
# Terminal reference layout: scale from screen height on every display.
# Use screen for legacy screen-relative percentages.
_TERM_LAYOUT_ASPECT = 4:3
# Terminal size and offsets use the centered reference layout.
# Offsets shift the centered display; decimal and negative offsets are allowed.
# Existing pixel values in custom configs/scripts must be converted once.

# === TERMINAL SETTINGS ===

_TERM_MARGIN = 5
_TERM_OVERLAY = enable    # enable | disable
# Overlay preserves native image aspect; 100 matches screen height.
# Zoom range 1..1000 percent; independent of _TERM_LAYOUT_ASPECT.
# Overlay offsets: percentages of screen height on BOTH axes (-100..100).
_TERM_OVERLAY_ZOOM = 150
_TERM_OVERLAY_OFFSET_X = 3.16
_TERM_OVERLAY_OFFSET_Y = 11.0
# Terminal content area, independently of the overlay image:
TERMINAL_WIDTH = 57.1875
TERMINAL_HEIGHT = 57.1875
TERMINAL_OFFSET_X = 0
TERMINAL_OFFSET_Y = 1.171875

# === SOUND ===

_TERM_TYPING_SOUND = enable
_TERM_TYPING_VOLUME = 50
_TERM_BACKGROUND_SOUND = enable
_TERM_BACKGROUND_VOLUME = 75
